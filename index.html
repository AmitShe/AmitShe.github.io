<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="משחקי עמית">
  <meta name="description" content="המשחקים והמיני־פרויקטים של עמית. בוחרים ופותחים מיד בדפדפן.">
  <title>מגרש המשחקים של עמית</title>
  <link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="preload" href="assets/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="/">
        <img src="assets/apple-touch-icon.png?v=2" alt="" width="38" height="38">
        <span>מגרש המשחקים של עמית</span>
      </a>
    </header>

    <main class="projects-section" id="projects" aria-labelledby="projects-title">
      <h1 id="projects-title">מה משחקים <span>היום?</span></h1>
      <div class="project-toolbar" hidden>
        <div class="project-filters" role="group" aria-label="סוג משחק">
          <button type="button" data-filter="all" aria-pressed="true">הכול</button>
          <button type="button" data-filter="math" aria-pressed="false">חשבון</button>
          <button type="button" data-filter="memory" aria-pressed="false">זיכרון</button>
          <button type="button" data-filter="precision" aria-pressed="false">דיוק</button>
          <button type="button" data-filter="music" aria-pressed="false">מוזיקה</button>
          <button type="button" data-filter="learning" aria-pressed="false">לימוד</button>
        </div>
        <p class="project-count" role="status"></p>
      </div>

      <div class="project-grid">
        <article class="project-card" data-category="learning">
          <a href="https://amitshe.github.io/fto-quest/" aria-label="ללמוד FTO עם FTO Quest" aria-describedby="fto-description">
            <div class="project-image">
              <img src="https://amitshe.github.io/fto-quest/icon-512.png" alt="אייקון קוביית FTO צבעונית" loading="lazy">
              <span class="play-icon" aria-hidden="true"></span>
            </div>
            <div class="project-content">
              <h2><bdi lang="en">FTO Quest</bdi></h2>
              <p id="fto-description">לומדים תנועות ופותרים אתגרי FTO</p>
            </div>
          </a>
        </article>

        <article class="project-card" data-category="math">
          <a href="https://amitshe.github.io/multiplication-bakery/" aria-label="לשחק במאפיית הכפל" aria-describedby="bakery-description">
            <div class="project-image">
              <img src="assets/multiplication-bakery.jpg" alt="שני ארנבים אופים עוגיות כוכב במאפייה">
              <span class="play-icon" aria-hidden="true"></span>
            </div>
            <div class="project-content">
              <h2>מאפיית הכפל</h2>
              <p id="bakery-description">כפל וחילוק עם עוגיות</p>
            </div>
          </a>
        </article>

        <article class="project-card" data-category="memory">
          <a href="https://amitshe.github.io/memory-garage/" aria-label="לשחק במוסך הזיכרון" aria-describedby="garage-description">
            <div class="project-image">
              <img src="assets/memory-garage.jpg" alt="מטוס, מנוף וכלי רכב צבעוניים בסגנון צעצועים">
              <span class="play-icon" aria-hidden="true"></span>
            </div>
            <div class="project-content">
              <h2>מוסך הזיכרון</h2>
              <p id="garage-description">מוצאים זוגות של כלי רכב</p>
            </div>
          </a>
        </article>

        <article class="project-card" data-category="precision">
          <a href="https://amitshe.github.io/cloud-kick/" aria-label="לשחק בכדור בעננים" aria-describedby="cloud-description">
            <div class="project-image">
              <img src="assets/cloud-kick.jpg?v=2" alt="ספיידרמן, מטוס ומנוף מעל מגרש כדורגל בעננים" loading="lazy">
              <span class="play-icon" aria-hidden="true"></span>
            </div>
            <div class="project-content">
              <h2>כדור בעננים</h2>
              <p id="cloud-description">כדורגל ומשימות תזמון</p>
            </div>
          </a>
        </article>

        <article class="project-card sea-card" data-category="precision">
          <a href="https://amitshe.github.io/tidelight/" aria-label="לשחק ב־Tidelight" aria-describedby="tide-description">
            <div class="project-image">
              <img src="assets/tidelight.jpg" alt="מגדלור מאיר ים חשוך" loading="lazy">
              <span class="play-icon" aria-hidden="true"></span>
            </div>
            <div class="project-content">
              <h2><bdi lang="en">Tidelight</bdi></h2>
              <p id="tide-description">מכוונים אור לסירות</p>
            </div>
          </a>
        </article>

        <article class="project-card party-card" data-category="music">
          <a href="https://amitshe.github.io/pajama-disco/" aria-label="לשחק בדיסקו פיג׳מות" aria-describedby="disco-description">
            <div class="project-image">
              <img src="assets/pajama-disco.jpg" alt="ארבע בובות פרווה על רחבת ריקודים" loading="lazy">
              <span class="play-icon" aria-hidden="true"></span>
            </div>
            <div class="project-content">
              <h2>דיסקו פיג׳מות</h2>
              <p id="disco-description">רוקדים עם הבובות</p>
            </div>
          </a>
        </article>
      </div>
    </main>

    <footer class="site-footer">
      <a href="https://github.com/AmitShe" target="_blank" rel="noopener noreferrer">הקוד ב־GitHub <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
  <script>
    const toolbar = document.querySelector(".project-toolbar");
    const filters = toolbar.querySelectorAll("[data-filter]");
    const cards = document.querySelectorAll(".project-card");
    const count = toolbar.querySelector(".project-count");

    function showCategory(activeFilter) {
      const category = activeFilter.dataset.filter;
      let visibleCount = 0;
      for (const card of cards) {
        const matches = category === "all" || card.dataset.category === category;
        card.hidden = !matches;
        if (matches) visibleCount++;
      }
      for (const filter of filters) {
        filter.setAttribute("aria-pressed", String(filter === activeFilter));
      }
      count.textContent = visibleCount === 1 ? "משחק אחד" : `${visibleCount} משחקים`;
    }

    for (const filter of filters) {
      filter.addEventListener("click", () => showCategory(filter));
    }
    showCategory(filters[0]);
    toolbar.hidden = false;
  </script>
</body>
</html>
